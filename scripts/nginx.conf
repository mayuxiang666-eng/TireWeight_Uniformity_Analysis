# TireWeight_Uniformity_Analysis Production Nginx Configuration

server {
    listen       80;
    server_name  localhost 10.246.97.159;

    # 1. 托管 Vue 3 编译产物 dist 静态网页
    location / {
        root   "D:/tu ai/TireWeight_Uniformity_Analysis/dist";
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. 反向代理后端 FastAPI API 接口 (端口 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
