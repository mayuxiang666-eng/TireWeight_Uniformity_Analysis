# TireWeight_Uniformity_Analysis Nginx Production Configuration

server {
    listen       8088;
    server_name  localhost 10.246.97.159;

    # 允许上传大文件
    client_max_body_size 50m;

    # 1. 托管 Vue 3 静态编译产物目录 (轮胎质量分析看板)
    location / {
        root   "D:/TU AI/TireWeight_Uniformity_Analysis/frontend/dist";
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. 反向代理后端 FastAPI API 接口 (端口 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 延长长查询超时限制
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 错误页面
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}
